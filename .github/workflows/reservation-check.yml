name: Reservation Availability Check

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Override START_DATE (YYYY-MM-DD)"
        required: false
      end_date:
        description: "Override END_DATE (YYYY-MM-DD)"
        required: false
      party_size:
        description: "Override PARTY_SIZE"
        required: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run availability check
        env:
          RESTAURANT_URL: ${{ vars.RESTAURANT_URL }}
          START_DATE: ${{ inputs.start_date || vars.START_DATE }}
          END_DATE: ${{ inputs.end_date || vars.END_DATE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PARTY_SIZE: ${{ inputs.party_size || vars.PARTY_SIZE }}
          UNAVAILABLE_CLASSES: ${{ vars.UNAVAILABLE_CLASSES }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          DEBUG_ALWAYS_EMAIL: ${{ vars.DEBUG_ALWAYS_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: node src/github-action-check.js
